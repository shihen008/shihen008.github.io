cache:
  enable: true

scheme: Gemini
darkmode: true

custom_file_path:
  style: source/_data/styles.styl

favicon:
  small: /images/favicon.svg
  medium: /images/favicon.svg
  apple_touch_icon: /images/avatar.svg
  safari_pinned_tab: /images/favicon.svg

creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: true
  language: deed.zh-hans

open_graph:
  enable: true

menu:
  首页: / || fa fa-home
  文章: /archives/ || fa fa-book
  项目: /projects/ || fa fa-code
  关于: /about/ || fa fa-user

menu_settings:
  icons: true
  badges: false

sidebar:
  position: right
  width_expanded: 320
  width_dual_column: 250
  display: post
  padding: 18
  offset: 12

avatar:
  url: /images/avatar.svg
  rounded: true
  rotated: false

site_state: true

social:
  GitHub: https://github.com/shihen008 || fab fa-github
  RSS: /atom.xml || fa fa-rss

social_icons:
  enable: true
  icons_only: false
  transition: false

toc:
  enable: true
  number: true
  wrap: true
  expand_all: false
  max_depth: 4

footer:
  since: 2015
  icon:
    name: fa fa-code
    animated: false
    color: "#19c6b3"
  copyright: PAUL
  powered: true

excerpt_description: true
read_more_btn: true

post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

symbols_count_time:
  separated_meta: true
  item_text_post: true
  item_text_total: false

tag_icon: true

codeblock:
  theme:
    light: stackoverflow-light
    dark: stackoverflow-dark
  copy_button:
    enable: true
    style: flat
  fold:
    enable: false
  language: true

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  color: "#19c6b3"
  height: 3px

bookmark:
  enable: false

github_banner:
  enable: true
  permalink: https://github.com/shihen008
  title: 在 GitHub 上查看我的项目

motion:
  enable: false

local_search:
  enable: true
  top_n_per_article: 3
  unescape: true
  preload: false

text_align:
  desktop: start
  mobile: start

mobile_layout_economy: true

theme_color:
  light: "#10243e"
  dark: "#07111f"

body_scrollbar:
  overlay: false
