title: 会写字的魔王
subtitle: 技术实践、工具开发与问题记录
description: PAUL 的个人主页，记录技术实践、工具开发与问题解决过程。
keywords:
  - 技术笔记
  - 开源项目
  - 工具开发
author: PAUL
language: zh-CN
timezone: Asia/Shanghai

url: https://shihen008.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

highlight:
  line_number: true
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false

index_generator:
  path: blog
  per_page: 10
  order_by: -date

per_page: 10
pagination_dir: page

theme: next

sitemap:
  path: sitemap.xml

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true

search:
  path: search.xml
  field: all
  content: true
  format: html

deploy:
  type:
